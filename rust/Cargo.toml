[package]
name = "laghu_rs"
version = "0.1.0"
edition = "2021"
description = "The optional Rust core of laghu: Unigram Viterbi and mean pooling over mapped files"
license = "MIT"
repository = "https://github.com/vedicreader/laghu"

[lib]
name = "laghu_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.0", features = ["abi3-py311", "extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
